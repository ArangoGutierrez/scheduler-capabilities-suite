apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurm-operator
  namespace: slinky
  labels:
    helm.sh/chart: slurm-operator-1.2.3
    app.kubernetes.io/part-of: slurm-operator
    app.kubernetes.io/name: slurm-operator
    app.kubernetes.io/instance: slurm-operator
    app.kubernetes.io/version: "1.2.3"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: slurm-operator
      app.kubernetes.io/instance: slurm-operator
  template:
    metadata:
      labels:
        helm.sh/chart: slurm-operator-1.2.3
        app.kubernetes.io/part-of: slurm-operator
        app.kubernetes.io/name: slurm-operator
        app.kubernetes.io/instance: slurm-operator
        app.kubernetes.io/version: "1.2.3"
        app.kubernetes.io/managed-by: Helm
    spec:
      hostname: slurm-operator
      priorityClassName: 
      serviceAccountName: slurm-operator
      
      containers:
        - name: slurm-operator
          image: ghcr.io/slinkyproject/slurm-operator@sha256:b35e76c09e587f1bc902bcff228b6c14e63ffd173afebf33e627480e67bc36ee
          imagePullPolicy: IfNotPresent
          args:
            - --accounting-workers
            - "4"
            - --controller-workers
            - "4"
            - --loginset-workers
            - "4"
            - --nodeset-workers
            - "4"
            - --restapi-workers
            - "4"
            - --token-workers
            - "4"
            - --slurmclient-workers
            - "2"
            - --zap-log-level
            - "info"
            - --health-addr
            - ":8081"
            - --metrics-addr
            - ":8080"
            - --profile-addr
            - "localhost:6060"
            - --leader-elect
            - --leader-elect-namespace
            - slinky
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
