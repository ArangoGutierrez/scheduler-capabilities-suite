apiVersion: slinky.slurm.net/v1beta1
kind: Controller
metadata:
  name: slurm
  namespace: slurm
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: slurm
    app.kubernetes.io/version: "26.05"
    helm.sh/chart: slurm-1.2.3
spec:
  slurmKeyRef:
    name: slurm-auth-slurm
    key: slurm.key
  jwtKeyRef:
    name: slurm-auth-jwt
    key: jwt.key
  extraConf: |-
    ReconfigFlags=KeepPartInfo
    GresTypes=gpu
    Nodeset=slurm-bridge Feature=slurm-bridge
    PartitionName=slurm-bridge Nodes=slurm-bridge State=UP Default=NO
    PreemptType=preempt/partition_prio
    PreemptMode=CANCEL
    Nodeset=slurm-bridge-preempt Feature=slurm-bridge-preempt
    PartitionName=slurm-bridge-preempt Nodes=slurm-bridge-preempt State=UP Default=NO PriorityTier=2
    
  configFileRefs:
    - name: slurm-config-extra
  prologScriptRefs:
  epilogScriptRefs:
  prologSlurmctldScriptRefs:
  epilogSlurmctldScriptRefs:
  slurmctld:
    args: []
    image: ghcr.io/slinkyproject/slurmctld@sha256:e5fa6666bd890f522a23cd292d17e57438f08260aaffd5aed652c0c6cf29687c
    imagePullPolicy: IfNotPresent
    resources: {}
  inplaceReconfigure: false
  reconfigure:
    image: ghcr.io/slinkyproject/slurmctld@sha256:e5fa6666bd890f522a23cd292d17e57438f08260aaffd5aed652c0c6cf29687c
    imagePullPolicy: IfNotPresent
    resources: {}
  logfile:
    image: docker.io/library/alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    imagePullPolicy: IfNotPresent
    resources: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: slurm
        app.kubernetes.io/version: "26.05"
        helm.sh/chart: slurm-1.2.3
    spec:
      affinity: {}
      imagePullSecrets: null
      initContainers: []
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: ""
      resources: {}
      tolerations: []
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    existingClaim: ""
    resources:
      requests:
        storage: 4Gi
  service:
    metadata: {}
    spec: {}
  metrics:
    enabled: false
    serviceMonitor:
      annotations: {}
      enabled: false
      endpoints:
      - path: /metrics/jobs
      - path: /metrics/nodes
      - path: /metrics/partitions
      - path: /metrics/scheduler
      interval: 30s
      labels: {}
      scrapeTimeout: 25s

