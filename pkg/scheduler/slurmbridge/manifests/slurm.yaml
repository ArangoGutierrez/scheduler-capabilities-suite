apiVersion: v1
kind: ConfigMap
metadata:
  name: slurm-config-extra
  namespace: slurm
  labels:
    helm.sh/chart: slurm-1.2.3
    app.kubernetes.io/part-of: slurm
    app.kubernetes.io/version: "26.05"
    app.kubernetes.io/managed-by: Helm
data:
  topology.yaml: |
    ---
    - topology: topo-switch
      cluster_default: true
      tree:
        switches:
          - switch: sw_root
            children: s[1-2]
          - switch: s1
          - switch: s2
    

