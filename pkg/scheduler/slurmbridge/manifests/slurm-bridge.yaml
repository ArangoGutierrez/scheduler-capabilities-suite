---
# Source: slurm-bridge/templates/scheduler/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: slurm
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
      resourceNamespace: slurm
      resourceName: slurm-bridge-scheduler
    profiles:
    - schedulerName: slurm-bridge-scheduler
      plugins:
        queueSort:
          enabled:
          - name: 'PrioritySort'
        preEnqueue:
          enabled:
          - name: 'SlurmBridge'
        preFilter:
          enabled:
          - name: 'VolumeBinding'
          - name: 'NodeResourcesFit'
          - name: 'SlurmBridge'
        filter:
          enabled:
          - name: 'VolumeBinding'
          - name: 'TaintToleration'
          - name: 'NodeResourcesFit'
          - name: 'SlurmBridge'
        postFilter:
          enabled:
          - name: 'SlurmBridge'
        reserve:
          enabled:
          - name: 'VolumeBinding'
        preBind:
          enabled:
          - name: 'VolumeBinding'
          - name: 'SlurmBridge'
        bind:
          enabled:
          - name: 'DefaultBinder'
        multiPoint:
          disabled:
          - name: '*'
      pluginConfig:
      - name: SlurmBridge

