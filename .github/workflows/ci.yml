# Unit specs and lint on every pull request and every push to main.
#
# The e2e probes are not run here: they need a kind cluster with kwok and,
# for the vanilla and kueue profiles, about 15 minutes on a 12-vCPU VM (the
# kai and slurm-bridge profiles have not been timed yet). Run them with
# `make e2e` on a machine that can host the cluster.
#
# Actions are pinned to full commit SHAs; Dependabot proposes the bumps.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: make test
        run: make test
      - name: make lint
        run: make lint
