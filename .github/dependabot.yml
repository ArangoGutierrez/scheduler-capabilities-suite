# Weekly update PRs for Go modules and the pinned GitHub Actions, one grouped
# PR per ecosystem so the k8s.io modules move together.
#
# Not covered, bump by hand: the kindest/node image digest (pkg/cluster),
# the kwok release (pkg/kwok), the Kueue release (pkg/scheduler/kueue) and
# the KAI Scheduler chart render (pkg/scheduler/kai).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
